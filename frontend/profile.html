<script>
        const BELT_COLORS = {
            White: '#e5e2e1', Blue: '#2563eb', Purple: '#7c3aed', Brown: '#5c3a21', Black: '#111111'
        };

        function updateSelector(sport) {
            // Update UI buttons
            const buttons = document.querySelectorAll('.sport-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-primary-container', 'text-on-primary-container', 'border-primary-container', 'glow-active');
                btn.classList.add('bg-surface-container', 'text-on-surface-variant', 'border-outline-variant');
            });

            const activeBtn = document.getElementById(`btn-${sport}`);
            activeBtn.classList.add('bg-primary-container', 'text-on-primary-container', 'border-primary-container', 'glow-active');
            activeBtn.classList.remove('bg-surface-container', 'text-on-surface-variant', 'border-outline-variant');

            // Reveal the conditional rank field now that a sport is chosen
            document.getElementById('conditional-rank-container').classList.remove('hidden');

            // Update conditional rank field
            const label = document.getElementById('rank-label');
            const select = document.getElementById('rank-select');

            if (sport === 'BJJ') {
                label.innerText = 'BELT RANK';
                select.innerHTML = `
                    <option value="White">WHITE</option>
                    <option value="Blue">BLUE</option>
                    <option value="Purple">PURPLE</option>
                    <option value="Brown">BROWN</option>
                    <option value="Black">BLACK</option>
                `;
            } else if (sport === 'MMA' || sport === 'Wrestling') {
                label.innerText = 'EXPERIENCE LEVEL';
                select.innerHTML = `
                    <option value="Beginner">BEGINNER</option>
                    <option value="Intermediate">INTERMEDIATE</option>
                    <option value="Advanced">ADVANCED</option>
                    <option value="Pro">PRO</option>
                `;
            } else {
                label.innerText = 'RANK';
                select.innerHTML = `
                    <option value="Kyū">KYŪ</option>
                    <option value="Dan">DAN</option>
                `;
            }
            updateLiveCard();
        }

        // --- Live ID card preview ---
        function updateLiveCard() {
            const name = document.getElementById('profile-name-input').value.trim();
            document.getElementById('card-name').textContent = name || 'YOUR NAME';

            const activeSportBtn = document.querySelector('.sport-btn.bg-primary-container');
            const sport = activeSportBtn ? activeSportBtn.id.replace('btn-', '') : null;
            document.getElementById('card-discipline').textContent = sport || '—';

            const rankSelect = document.getElementById('rank-select');
            const rankLabelText = document.getElementById('rank-label').textContent;
            const cardRankLabel = document.getElementById('card-rank-label');
            const cardRank = document.getElementById('card-rank');
            const swatch = document.getElementById('card-belt-swatch');

            if (sport && rankSelect.value) {
                cardRankLabel.textContent = rankLabelText;
                cardRank.textContent = rankSelect.options[rankSelect.selectedIndex].text;
                if (sport === 'BJJ' && BELT_COLORS[rankSelect.value]) {
                    swatch.style.backgroundColor = BELT_COLORS[rankSelect.value];
                    swatch.classList.remove('hidden');
                } else {
                    swatch.classList.add('hidden');
                }
            } else {
                cardRank.textContent = '—';
                swatch.classList.add('hidden');
            }
        }

        document.getElementById('profile-name-input').addEventListener('input', updateLiveCard);
        document.getElementById('rank-select')?.addEventListener('change', updateLiveCard);
        document.addEventListener('change', (e) => {
            if (e.target && e.target.id === 'rank-select') updateLiveCard();
        });

        // --- Avatar upload ---
        function setAvatarImage(dataUrl) {
            const bigDisplay = document.getElementById('avatar-display');
            bigDisplay.innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover">`;
            const cardAvatar = document.getElementById('card-avatar');
            cardAvatar.innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover">`;
        }

        document.getElementById('avatar-upload-trigger').addEventListener('click', () => {
            document.getElementById('avatar-file-input').click();
        });

        document.getElementById('avatar-file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (evt) {
                const img = new Image();
                img.onload = function () {
                    const size = 300;
                    const canvas = document.createElement('canvas');
                    canvas.width = size; canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    const scale = Math.max(size / img.width, size / img.height);
                    const w = img.width * scale, h = img.height * scale;
                    ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
                    const resized = canvas.toDataURL('image/jpeg', 0.85);
                    setAvatarImage(resized);
                    window._ringcheckAvatarData = resized;
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        });

        // --- Stats from real scan history ---
        function loadStats() {
            let history = [];
            try { history = JSON.parse(localStorage.getItem('ringcheck_history') || '[]'); } catch (e) {}
            document.getElementById('stat-total-scans').textContent = history.length;
            document.getElementById('card-scans').textContent = history.length;
            if (history.length > 0) {
                const avg = history.reduce((sum, h) => sum + (h.confidence || 0), 0) / history.length;
                document.getElementById('stat-avg-confidence').textContent = Math.round(avg * 100) + '%';
            } else {
                document.getElementById('stat-avg-confidence').textContent = '—';
            }
        }

        // --- Load saved profile on page load ---
        function loadProfile() {
            let profile = null;
            try { profile = JSON.parse(localStorage.getItem('ringcheck_profile') || 'null'); } catch (e) {}
            if (profile) {
                document.getElementById('profile-name-input').value = profile.name || '';
                if (profile.avatar) {
                    setAvatarImage(profile.avatar);
                    window._ringcheckAvatarData = profile.avatar;
                }
                if (profile.sport) {
                    updateSelector(profile.sport);
                    if (profile.rank) {
                        document.getElementById('rank-select').value = profile.rank;
                    }
                }
                if (profile.tier) {
                    document.getElementById('card-tier').textContent = profile.tier.toUpperCase();
                }
            }
            updateLiveCard();
            loadStats();
        }

        // --- Save profile ---
        document.getElementById('confirm-save-btn').addEventListener('click', () => {
            const name = document.getElementById('profile-name-input').value.trim();
            const activeSportBtn = document.querySelector('.sport-btn.bg-primary-container');
            const sport = activeSportBtn ? activeSportBtn.id.replace('btn-', '') : null;
            const rankSelect = document.getElementById('rank-select');
            const rank = (sport && rankSelect) ? rankSelect.value : null;

            let existing = {};
            try { existing = JSON.parse(localStorage.getItem('ringcheck_profile') || '{}'); } catch (e) {}

            const profile = {
                name: name,
                sport: sport,
                rank: rank,
                avatar: window._ringcheckAvatarData || existing.avatar || null,
                tier: existing.tier || 'free'
            };
            localStorage.setItem('ringcheck_profile', JSON.stringify(profile));

            const btn = document.getElementById('confirm-save-btn');
            const original = btn.innerHTML;
            btn.innerHTML = '<span>SAVED ✓</span>';
            setTimeout(() => { btn.innerHTML = original; }, 1200);
        });

        // --- Share ID card (basic text share for now) ---
        document.getElementById('share-card-btn').addEventListener('click', async () => {
            const name = document.getElementById('card-name').textContent;
            const discipline = document.getElementById('card-discipline').textContent;
            const rank = document.getElementById('card-rank').textContent;
            const scans = document.getElementById('card-scans').textContent;
            const text = `${name} — RingCheck ID\nDiscipline: ${discipline}\nRank: ${rank}\nScans logged: ${scans}`;

            if (navigator.share) {
                try { await navigator.share({ title: 'My RingCheck ID Card', text }); } catch (e) {}
            } else if (navigator.clipboard) {
                await navigator.clipboard.writeText(text);
                const btn = document.getElementById('share-card-btn');
                const original = btn.innerHTML;
                btn.innerHTML = '<span>COPIED TO CLIPBOARD</span>';
                setTimeout(() => { btn.innerHTML = original; }, 1500);
            }
        });

        loadProfile();
    </script>
</body></html>

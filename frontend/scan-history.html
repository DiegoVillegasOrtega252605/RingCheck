<script>
<script>
        // --- Render real scan history from localStorage ---
        (function renderHistory() {
            const listEl = document.getElementById('scan-log-list');
            const emptyEl = document.getElementById('empty-state');
            const countLabel = document.getElementById('scan-count-label');
            const issuesLabel = document.getElementById('active-issues-label');

            let history = [];
            try {
                history = JSON.parse(localStorage.getItem('ringcheck_history') || '[]');
            } catch (e) {
                history = [];
            }

            countLabel.textContent = `${history.length} SCAN${history.length === 1 ? '' : 'S'} COMPLETED`;
            const flaggedCount = history.filter(h => h.ringworm).length;
            issuesLabel.textContent = `${flaggedCount} ACTIVE ISSUE${flaggedCount === 1 ? '' : 'S'}`;

            if (history.length === 0) {
                emptyEl.classList.remove('hidden');
                emptyEl.classList.add('flex');
                return;
            }

            // Most recent first
            history.slice().reverse().forEach((entry) => {
                const date = new Date(entry.timestamp);
                const dateStr = date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();
                const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const isClear = !entry.ringworm;

                const item = document.createElement('div');
                item.className = 'group relative bg-surface-container-high border border-outline-variant p-sm flex gap-md items-start transition-all hover:border-primary-fixed/50';
                item.innerHTML = `
                    <div class="relative w-24 h-24 flex-shrink-0 bg-background border border-surface-variant overflow-hidden">
                        <img class="w-full h-full object-cover" src="${entry.thumbnail || ''}" alt="Scan thumbnail">
                    </div>
                    <div class="flex-grow flex flex-col justify-between min-h-[96px]">
                        <div>
                            <div class="flex justify-between items-start">
                                <span class="font-label-caps text-label-caps text-on-surface-variant">${dateStr} | ${timeStr}</span>
                                <div class="flex items-center gap-xs">
                                    <span class="w-2 h-2 rounded-full ${isClear ? 'bg-primary-fixed' : 'bg-secondary-container'}"></span>
                                    <span class="font-label-caps text-label-caps ${isClear ? 'text-primary-fixed' : 'text-secondary-container'}">${isClear ? 'CLEAR' : 'FLAGGED'}</span>
                                </div>
                            </div>
                            <h3 class="font-data-num text-data-num text-primary mt-base">${Math.round((entry.confidence || 0) * 100)}% CONFIDENCE</h3>
                        </div>
                    </div>
                `;
                listEl.appendChild(item);
            });
        })();

        // Micro-interaction for buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const rect = btn.getBoundingClientRect();
                const ripple = document.createElement('div');
                ripple.className = 'absolute bg-primary-fixed opacity-30 rounded-full animate-ping';
                ripple.style.width = ripple.style.height = Math.max(rect.width, rect.height) + 'px';
                ripple.style.left = e.clientX - rect.left - (parseInt(ripple.style.width)/2) + 'px';
                ripple.style.top = e.clientY - rect.top - (parseInt(ripple.style.height)/2) + 'px';
                btn.classList.add('relative', 'overflow-hidden');
                btn.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });
    </script>

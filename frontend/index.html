<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.2;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 12px rgba(195, 244, 0, 0.3); }
            50% { box-shadow: 0 0 24px rgba(195, 244, 0, 0.6); }
        }
        .glow-active {
            animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .viewfinder-corner {
            position: absolute;
            width: 24px;
            height: 24px;
            border-color: #abd600;
        }
        .corner-tl { top: 20px; left: 20px; border-top: 2px solid; border-left: 2px solid; }
        .corner-tr { top: 20px; right: 20px; border-top: 2px solid; border-right: 2px solid; }
        .corner-bl { bottom: 20px; left: 20px; border-bottom: 2px solid; border-left: 2px solid; }
        .corner-br { bottom: 20px; right: 20px; border-bottom: 2px solid; border-right: 2px solid; }
    </style>
</head>
<body class="bg-[#080b11] text-on-background font-body-md selection:bg-primary-container selection:text-on-primary-container overflow-hidden h-screen flex flex-col items-center justify-center relative">
<!-- Scanline Overlay -->
<div class="scanlines"></div>
<!-- Viewfinder Visual Markers -->
<div class="viewfinder-corner corner-tl opacity-40"></div>
<div class="viewfinder-corner corner-tr opacity-40"></div>
<div class="viewfinder-corner corner-bl opacity-40"></div>
<div class="viewfinder-corner corner-br opacity-40"></div>
<!-- Atmospheric Noise/Texture Background -->
<div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png')"></div>
<!-- Main Splash Canvas -->
<main class="relative z-10 w-full max-w-[400px] flex flex-col items-center px-margin-mobile">
<div class="absolute -inset-20 z-0"></div>
<!-- Logo Container -->
<div class="relative w-full aspect-square flex items-center justify-center mb-lg">
<div class="absolute inset-0 scale-125 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-primary-fixed-dim/20 via-transparent to-transparent"></div>
<img class="w-full h-auto max-w-[280px] drop-shadow-[0_0_30px_rgba(195,244,0,0.15)] animate-in fade-in zoom-in duration-1000" src="assets/anaconda-logo.png">
</div>
<!-- Identity & Branding -->
<div class="text-center space-y-base mb-xl z-10">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile tracking-[0.2em] text-primary flex items-center justify-center gap-xs">
                RING<span class="text-primary-fixed">CHECK</span>
</h1>
<div class="flex items-center justify-center gap-base">
<div class="h-[1px] w-8 bg-outline-variant"></div>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">
                    STAY ON THE MAT.
                </p>
<div class="h-[1px] w-8 bg-outline-variant"></div>
</div>
</div>
<!-- Transactional Action Area -->
<div class="w-full space-y-md z-10">
<button class="w-full bg-primary-fixed text-on-primary-fixed py-lg font-label-caps text-label-caps tracking-widest uppercase flex items-center justify-center gap-sm glow-active transition-all active:scale-95 group" onclick="window.location.href='scan-hub.html'">
                GET STARTED
                <span class="material-symbols-outlined text-[18px] transition-transform group-hover:translate-x-1">arrow_forward_ios</span>
</button>
<!-- Secondary Hardware Info Chips -->
<div class="flex justify-between items-center px-xs">
<div class="flex flex-col">
<span class="font-label-caps text-[10px] text-outline opacity-60">FIRMWARE</span>
<span class="font-label-caps text-[12px] text-on-surface-variant">v2.4.0-STABLE</span>
</div>
<div class="flex items-center gap-xs">
<div class="w-2 h-2 rounded-full bg-primary-fixed animate-pulse"></div>
<span class="font-label-caps text-[10px] text-on-surface-variant">SYSTEM ARMED</span>
</div>
</div>
</div>
</main>
<!-- Bottom Data Footer (HUD Style) -->
<footer class="fixed bottom-lg w-full max-w-[400px] px-margin-mobile flex flex-col gap-base pointer-events-none opacity-40">
<div class="flex justify-between font-label-caps text-[10px] text-outline">
<span>CORE_SYNC: ACTIVE</span>
<span>DATA_STREAM: ENCRYPTED</span>
</div>
<div class="w-full h-[2px] bg-surface-variant relative overflow-hidden">
<div class="absolute top-0 left-0 h-full bg-primary-fixed w-1/3 animate-[loading_4s_ease-in-out_infinite]"></div>
</div>
</footer>
<style>
        @keyframes loading {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(300%); }
            100% { transform: translateX(-100%); }
        }
    </style>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log('RINGCHECK Tactical OS Booted...');
            document.addEventListener('mousemove', (e) => {
                const logo = document.querySelector('img');
                if (logo) {
                    const x = (window.innerWidth / 2 - e.pageX) / 50;
                    const y = (window.innerHeight / 2 - e.pageY) / 50;
                    logo.style.transform = `translate(${x}px, ${y}px)`;
                }
            });
        });
    </script>
</body></html>

<script>
        // --- Render real inference result from scan-analysis.html ---
        (function renderResult() {
            const raw = sessionStorage.getItem('ringcheck_result');
            const numSegments = 10;
            const segmentsContainer = document.getElementById('segmented-progress');

            let hasRingworm = false;
            let confidencePct = 0;

            if (raw) {
                try {
                    const data = JSON.parse(raw);
                    hasRingworm = !!data.ringworm;
                    confidencePct = Math.round((data.confidence || 0) * 100);
                } catch (e) {
                    console.error('Could not parse stored result:', e);
                }
            } else {
                console.warn('No scan result found in sessionStorage — showing placeholder.');
            }

            // Confidence number + segmented bar
            document.getElementById('confidence-value').textContent = `${confidencePct}%`;
            const activeSegments = Math.round((confidencePct / 100) * numSegments);
            for (let i = 0; i < numSegments; i++) {
                const seg = document.createElement('div');
                if (i < activeSegments) seg.classList.add('active');
                segmentsContainer.appendChild(seg);
            }

            const badge = document.getElementById('status-badge');
            const icon = document.getElementById('status-icon');
            const statusText = document.getElementById('status-text');
            const subtitle = document.getElementById('status-subtitle');
            const headline = document.getElementById('result-headline');
            const advisoryHeadline = document.getElementById('advisory-headline');
            const advisorySubtitle = document.getElementById('advisory-subtitle');

            if (hasRingworm) {
                // Positive / warning state — swap green for amber
                headline.textContent = 'REVIEW NEEDED';
                badge.classList.remove('bg-primary-container', 'text-on-primary-container', 'shadow-[0_0_20px_rgba(195,244,0,0.4)]');
                badge.classList.add('bg-secondary-container', 'text-on-secondary-container', 'shadow-[0_0_20px_rgba(254,183,0,0.4)]');
                icon.textContent = 'warning';
                statusText.textContent = 'STATUS: FLAGGED';
                subtitle.textContent = 'POSSIBLE SKIN CONDITION DETECTED.';
                advisoryHeadline.textContent = 'SEE A DOCTOR.';
                advisorySubtitle.textContent = 'Avoid mat contact until cleared by a physician.';
            } else {
                headline.textContent = 'MAT-READY';
                statusText.textContent = 'STATUS: CLEAR';
                subtitle.textContent = 'NO DETECTABLE SKIN CONDITIONS.';
                advisoryHeadline.textContent = 'KEEP TRAINING.';
                advisorySubtitle.textContent = 'Clear for competition contact.';
            }
        })();

        function makeThumbnail(dataUrl, maxSize, callback) {
            const img = new Image();
            img.onload = function () {
                const scale = Math.min(maxSize / img.width, maxSize / img.height, 1);
                const canvas = document.createElement('canvas');
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                callback(canvas.toDataURL('image/jpeg', 0.7));
            };
            img.onerror = function () { callback(''); };
            img.src = dataUrl;
        }

        function logToHistory(btn) {
            const rawResult = sessionStorage.getItem('ringcheck_result');
            const capturedImage = sessionStorage.getItem('ringcheck_captured_image');
            let result = { ringworm: false, confidence: 0 };
            try { result = JSON.parse(rawResult) || result; } catch (e) {}

            const saveEntry = (thumbnail) => {
                let history = [];
                try { history = JSON.parse(localStorage.getItem('ringcheck_history') || '[]'); } catch (e) {}
                history.push({
                    timestamp: Date.now(),
                    ringworm: !!result.ringworm,
                    confidence: result.confidence || 0,
                    thumbnail: thumbnail
                });
                try {
                    localStorage.setItem('ringcheck_history', JSON.stringify(history));
                } catch (e) {
                    // Storage full — drop oldest entry and retry once
                    history.shift();
                    try { localStorage.setItem('ringcheck_history', JSON.stringify(history)); } catch (e2) {}
                }
                btn.textContent = 'SAVED ✓';
                setTimeout(() => { window.location.href = 'scan-history.html'; }, 500);
            };

            if (capturedImage) {
                makeThumbnail(capturedImage, 200, saveEntry);
            } else {
                saveEntry('');
            }
        }

        document.querySelectorAll('button, a').forEach(el => {
            el.addEventListener('mousedown', () => { el.classList.add('scale-95'); });
            el.addEventListener('mouseup', () => { el.classList.remove('scale-95'); });
            el.addEventListener('mouseleave', () => { el.classList.remove('scale-95'); });
        });
        let glowDirection = 1;
        let glowOpacity = 0.5;
        function animateGlow() {
            glowOpacity += (0.01 * glowDirection);
            if(glowOpacity > 0.8 || glowOpacity < 0.3) glowDirection *= -1;
            const img = document.querySelector('.drop-shadow');
            if(img) {
                img.style.filter = `drop-shadow(0 0 ${10 + (glowOpacity * 10)}px rgba(195, 244, 0, ${glowOpacity}))`;
            }
            requestAnimationFrame(animateGlow);
        }
        animateGlow();
    </script>

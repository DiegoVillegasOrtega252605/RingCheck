<script>
    // --- Real camera access ---
    const video = document.getElementById('camera-feed');
    const canvas = document.getElementById('capture-canvas');
    const cameraError = document.getElementById('camera-error');

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 1280 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        console.error('Camera access failed:', err);
        video.classList.add('hidden');
        cameraError.classList.remove('hidden');
      }
    }
    startCamera();

    // --- Capture button: grab frame, store it, go to analysis ---
    document.querySelector('button[class*="rounded-full border-4"]')?.addEventListener('click', () => {
      const flash = document.createElement('div');
      flash.className = 'fixed inset-0 bg-white z-[100] pointer-events-none opacity-0';
      flash.style.transition = 'opacity 0.1s ease-out';
      document.body.appendChild(flash);

      // Draw the current video frame to canvas
      if (video.videoWidth > 0) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageDataUrl = canvas.toDataURL('image/jpeg', 0.9);
        sessionStorage.setItem('ringcheck_captured_image', imageDataUrl);
      }

      // Stop camera stream before navigating away
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }

      requestAnimationFrame(() => {
        flash.style.opacity = '1';
        setTimeout(() => {
          flash.style.opacity = '0';
          setTimeout(() => {
            flash.remove();
            window.location.href = 'scan-analysis.html';
          }, 100);
        }, 50);
      });
    });
  </script>
